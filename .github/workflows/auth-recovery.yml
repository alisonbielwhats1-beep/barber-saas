name: Supabase Auth recovery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: auth-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      AUTH_PROVIDER: supabase
      AUTH_EMAIL_ENABLED: "true"
      NEXTAUTH_SECRET: synthetic-auth-validation-secret-only
      NEXTAUTH_URL: http://127.0.0.1:3100
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      RUN_SUPABASE_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start isolated Auth, database and SMTP inbox
        run: supabase start --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export only local test credentials
        run: |
          supabase status -o json > "$RUNNER_TEMP/local-supabase.json"
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/local-supabase.json"));fs.appendFileSync(process.env.GITHUB_ENV,`SUPABASE_URL=${s.API_URL}\nSUPABASE_AUTH_PUBLISHABLE_KEY=${s.ANON_KEY}\nSUPABASE_SERVICE_ROLE_KEY=${s.SERVICE_ROLE_KEY}\n`);'
      - run: npm run db:safety-check
      - run: npx prisma db push --skip-generate
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - name: Recover owner and customer credentials through real local Auth and SMTP
        run: npx playwright test tests/e2e/supabase-recovery.spec.ts --project=chromium --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supabase-recovery-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop isolated services
        if: always()
        run: supabase stop --no-backup
