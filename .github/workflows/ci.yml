name: CI

on:
  push:
    branches: [master, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salon_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d salon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salon_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/salon_ci
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-prod
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify monitoring failure and recovery without production requests
        run: node --test scripts/health-monitor.test.mjs
      - name: Verify runtime environment contract
        run: npm run check:runtime
      - run: npx prisma generate
      - name: Verify safe database target
        run: npm run db:safety-check
      - name: Prepare Supabase-compatible roles
        run: |
          printf '%s' 'DO $$ BEGIN CREATE ROLE anon; EXCEPTION WHEN duplicate_object THEN NULL; END $$; DO $$ BEGIN CREATE ROLE authenticated; EXCEPTION WHEN duplicate_object THEN NULL; END $$;' |
            npx prisma db execute --stdin --url "$DIRECT_URL"
      - name: Prepare pre-Phase-1 integration baseline
        run: >-
          npx prisma db execute
          --file tests/fixtures/pre-phase1-invite-schema.sql
          --url "$DIRECT_URL"
      - name: Apply real invite migrations in order
        run: |
          npx prisma db execute --file prisma/migrations/20260728220000_fase_1_security_invites/migration.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/migrations/20260729120000_user_invite_created_by_index/migration.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/migrations/20260729164510_email_professional_invites/migration.sql --url "$DIRECT_URL"
      - name: Run read-only password recovery preflight
        run: npx prisma db execute --file prisma/sql/manual/017_password_recovery.preflight.sql --url "$DIRECT_URL"
      - name: Apply password recovery schema
        run: npx prisma db execute --file prisma/sql/manual/017_password_recovery.sql --url "$DIRECT_URL"
      - name: Prepare tenant helper for platform approval migration
        run: >-
          npx prisma db execute
          --file tests/fixtures/fase2-app-current-salon.sql
          --url "$DIRECT_URL"
      - name: Apply platform approval schema used by the current Prisma client
        run: |
          npx prisma db execute --file prisma/sql/manual/010_platform_access_approval.preflight.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/010_platform_access_approval.sql --url "$DIRECT_URL"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  schema-smoke:
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: salon_schema_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d salon_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALLOW_DESTRUCTIVE_DB_OPERATIONS: YES_I_AM_USING_A_DISPOSABLE_DATABASE
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/salon_schema_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/salon_schema_ci
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-prod
      NEXTAUTH_URL: http://127.0.0.1:3100
      RUN_POSTGRES_INTEGRATION: "1"
      RUN_DATABASE_E2E: "1"
      HQ_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Verify safe database target
        run: npm run db:safety-check
      - name: Apply predecessor schema to prove a real upgrade
        run: |
          git show d665f44e457af31c80ce13cceffa85bec1351b39:prisma/schema.prisma > prisma/pre018.prisma
          npm run db:push -- --schema prisma/pre018.prisma
          npx prisma generate --schema prisma/pre018.prisma
      - name: Run read-only password recovery preflight
        run: npx prisma db execute --file prisma/sql/manual/017_password_recovery.preflight.sql --url "$DIRECT_URL"
      - name: Prove idempotent password recovery schema
        run: npx prisma db execute --file prisma/sql/manual/017_password_recovery.sql --url "$DIRECT_URL"
      - name: Prepare tenant helper for Phase 2 migration
        run: >-
          npx prisma db execute
          --file tests/fixtures/fase2-app-current-salon.sql
          --url "$DIRECT_URL"
      - name: Run read-only Phase 2 preflight
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/008_fase2_appointment_reliability.preflight.sql
          --url "$DIRECT_URL"
      - name: Apply Phase 2 reliability migration
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/008_fase2_appointment_reliability.sql
          --url "$DIRECT_URL"
      - name: Run read-only waitlist preflight
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/009_waitlist_reliability.preflight.sql
          --url "$DIRECT_URL"
      - name: Apply waitlist reliability migration
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/009_waitlist_reliability.sql
          --url "$DIRECT_URL"
      - name: Run read-only platform approval preflight
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/010_platform_access_approval.preflight.sql
          --url "$DIRECT_URL"
      - name: Apply platform approval migration
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/010_platform_access_approval.sql
          --url "$DIRECT_URL"
      - name: Run read-only tenant-aware product preflight
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/012_appointment_product_tenant_snapshots.preflight.sql
          --url "$DIRECT_URL"
      - name: Apply tenant-aware appointment product migration
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/012_appointment_product_tenant_snapshots.sql
          --url "$DIRECT_URL"
      - name: Run read-only operational index preflight
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/013_operational_query_indexes.preflight.sql
          --url "$DIRECT_URL"
      - name: Apply operational query indexes
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/013_operational_query_indexes.sql
          --url "$DIRECT_URL"
      - name: Run read-only booking experience preflight
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/016_booking_experience.preflight.sql
          --url "$DIRECT_URL"
      - name: Apply booking experience migration
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/016_booking_experience.sql
          --url "$DIRECT_URL"
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Seed disposable database
        run: npm run db:seed
      - name: Back up synthetic predecessor database and snapshot existing records
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d salon_schema_ci > "$RUNNER_TEMP/pre018.sql"
          test -s "$RUNNER_TEMP/pre018.sql"
          docker exec ${{ job.services.postgres.id }} createdb -U postgres salon_restore_ci
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d salon_restore_ci -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/pre018.sql" > /dev/null
          npx prisma db execute --file tests/fixtures/018-preservation-before.sql --url "$DIRECT_URL"
      - name: Preflight, apply and reapply openings and check-in migration
        run: |
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.preflight.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.preflight.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.verify.sql --url "$DIRECT_URL"
          npx prisma db execute --file tests/fixtures/018-preservation-after.sql --url "$DIRECT_URL"
          npx prisma db execute --file tests/fixtures/018-rls-check.sql --url "$DIRECT_URL"
          npx prisma generate
      - name: Back up and restore the 018 predecessor before product migration
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d salon_schema_ci > "$RUNNER_TEMP/pre019.sql"
          test -s "$RUNNER_TEMP/pre019.sql"
          docker exec ${{ job.services.postgres.id }} createdb -U postgres salon_restore019_ci
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d salon_restore019_ci -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/pre019.sql" > /dev/null
          npx prisma db execute --file tests/fixtures/019-preservation-before.sql --url "$DIRECT_URL"
      - name: Preflight, apply, reapply and verify product migration 019
        run: |
          npx prisma db execute --file prisma/sql/manual/019_product_depth.preflight.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/019_product_depth.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/019_product_depth.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/019_product_depth.verify.sql --url "$DIRECT_URL"
          npx prisma db execute --file tests/fixtures/019-preservation-after.sql --url "$DIRECT_URL"
          npx prisma generate
      - name: Back up and restore synthetic predecessor before HQ migration
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d salon_schema_ci > "$RUNNER_TEMP/pre020.sql"
          test -s "$RUNNER_TEMP/pre020.sql"
          docker exec ${{ job.services.postgres.id }} createdb -U postgres salon_restore020_ci
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d salon_restore020_ci -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/pre020.sql" > /dev/null
          docker exec -i ${{ job.services.postgres.id }} psql -X -A -t -U postgres -d salon_schema_ci -v ON_ERROR_STOP=1 < tests/fixtures/020-preservation-fingerprint.sql > "$RUNNER_TEMP/pre020-fingerprint.txt"
      - name: Preflight, apply, reapply and verify HQ 020 and predecessor preservation
        run: |
          npx prisma db execute --file prisma/sql/manual/020_everflare_hq.preflight.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/020_everflare_hq.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/020_everflare_hq.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/020_everflare_hq.verify.sql --url "$DIRECT_URL"
          docker exec -i ${{ job.services.postgres.id }} psql -X -A -t -U postgres -d salon_schema_ci -v ON_ERROR_STOP=1 < tests/fixtures/020-preservation-fingerprint.sql > "$RUNNER_TEMP/post020-fingerprint.txt"
          diff -u "$RUNNER_TEMP/pre020-fingerprint.txt" "$RUNNER_TEMP/post020-fingerprint.txt"
          npx prisma generate
          npx vitest run src/lib/hq/hq-postgres.integration.test.ts
          npx prisma db execute --file prisma/sql/manual/020_everflare_hq.rollback.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/020_everflare_hq.verify.sql --url "$DIRECT_URL"
      - name: Back up, restore and snapshot predecessor for variable prices
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d salon_schema_ci > "$RUNNER_TEMP/pre021.sql"
          test -s "$RUNNER_TEMP/pre021.sql"
          docker exec ${{ job.services.postgres.id }} createdb -U postgres salon_restore021_ci
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d salon_restore021_ci -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/pre021.sql" > /dev/null
          npx prisma db execute --file tests/fixtures/021-preservation-before.sql --url "$DIRECT_URL"
      - name: Verify variable price upgrade, reapplication and preservation
        run: |
          npx prisma db execute --file prisma/sql/manual/021_variable_service_prices.preflight.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/021_variable_service_prices.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/021_variable_service_prices.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/021_variable_service_prices.verify.sql --url "$DIRECT_URL"
          npx prisma db execute --file tests/fixtures/021-preservation-after.sql --url "$DIRECT_URL"
          npx vitest run src/lib/__tests__/product-depth-postgres.integration.test.ts src/lib/__tests__/variable-price-postgres.integration.test.ts
      - name: Prove appointment and comanda concurrency with PostgreSQL, plus public access locking
        run: npm run test:appointment-integration
      - name: Prove tenant-isolated password recovery with PostgreSQL
        run: npm run test:password-recovery-integration
      - name: Restore the complete current synthetic database and compare every table
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d salon_schema_ci > "$RUNNER_TEMP/current-synthetic.sql"
          test -s "$RUNNER_TEMP/current-synthetic.sql"
          docker exec ${{ job.services.postgres.id }} createdb -U postgres salon_restore_current_ci
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d salon_restore_current_ci -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/current-synthetic.sql" > /dev/null
          docker exec -i ${{ job.services.postgres.id }} psql -X -A -t -U postgres -d salon_schema_ci -v ON_ERROR_STOP=1 < tests/fixtures/restore-fingerprint.sql > "$RUNNER_TEMP/source-fingerprint.txt"
          docker exec -i ${{ job.services.postgres.id }} psql -X -A -t -U postgres -d salon_restore_current_ci -v ON_ERROR_STOP=1 < tests/fixtures/restore-fingerprint.sql > "$RUNNER_TEMP/restored-fingerprint.txt"
          test -s "$RUNNER_TEMP/source-fingerprint.txt"
          diff -u "$RUNNER_TEMP/source-fingerprint.txt" "$RUNNER_TEMP/restored-fingerprint.txt"
      - name: Build the production application for browser tests
        run: npm run build
      - name: Verify variable price recovery inventory
        run: npx prisma db execute --file prisma/sql/manual/021_variable_service_prices.rollback.sql --url "$DIRECT_URL"
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate public pages across browser engines
        run: npm run test:e2e:static
      - name: Validate authenticated critical journeys
        run: npm run test:e2e:database
      - name: Preserve browser evidence from synthetic tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Prove non-destructive openings and check-in rollback
        run: |
          npx prisma db execute --file prisma/sql/manual/019_product_depth.rollback.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/019_product_depth.verify.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.rollback.sql --url "$DIRECT_URL"
          npx prisma db execute --file prisma/sql/manual/018_openings_checkin.verify.sql --url "$DIRECT_URL"
      - name: Prove non-destructive Phase 2 rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/008_fase2_appointment_reliability.rollback.sql
          --url "$DIRECT_URL"
      - name: Prove non-destructive waitlist rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/009_waitlist_reliability.rollback.sql
          --url "$DIRECT_URL"
      - name: Prove non-destructive platform approval rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/010_platform_access_approval.rollback.sql
          --url "$DIRECT_URL"
      - name: Prove non-destructive appointment product rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/012_appointment_product_tenant_snapshots.rollback.sql
          --url "$DIRECT_URL"
      - name: Prove operational index rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/013_operational_query_indexes.rollback.sql
          --url "$DIRECT_URL"
      - name: Prove non-destructive booking experience rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/016_booking_experience.rollback.sql
          --url "$DIRECT_URL"
      - name: Prove non-destructive password recovery rollback SQL
        run: >-
          npx prisma db execute
          --file prisma/sql/manual/017_password_recovery.rollback.sql
          --url "$DIRECT_URL"
